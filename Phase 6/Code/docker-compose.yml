
version: '3.8'

services:
  # The Mistral Agent API we built in Module 3
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    depends_on:
      - vector_db

  # The Vector Database for the Memory Vault
  vector_db:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
